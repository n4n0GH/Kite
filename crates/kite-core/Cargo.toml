[package]
name = "kite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser backend for Kite: profiles, history, bookmarks, sessions, search, adblock and the WebExtension runtime"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
url.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["json"] }
directories = "6"
regex = "1"
uuid = { version = "1", features = ["v4"] }
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver"] }
percent-encoding = "2"
base64 = "0.22"
mime_guess = "2"
log = "0.4"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
csv = "1"

[dev-dependencies]
tempfile = "3"
