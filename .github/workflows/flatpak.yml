# Builds Kite as a Flatpak when a release is published, attaches the bundle
# to the release, and publishes the Flatpak repository that installed copies
# update from (served by GitHub Pages).
#
# Can also be started by hand from the Actions page. The bundle is then an
# artifact of the run; the repository is only published when asked to.
#
# What runs here is named by what it is, not by a name that can be moved: each
# action by its commit (the tag it was is in the comment beside it), the
# container by its digest. This run holds the key that signs what users
# install: a tag pointed elsewhere later would have run with it. To take a
# newer one, look at what changed, then put its commit or digest here:
#   git ls-remote https://github.com/<owner>/<action> 'refs/tags/<tag>^{}'

name: Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to the Flatpak repository that users update from
        type: boolean
        default: false

env:
  # Where GitHub Pages serves the repository. Installed copies remember it.
  SITE_URL: https://n4n0gh.github.io/Kite

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # (Reads the source and no more: the release is written to by a job of its
    # own, below, which runs nothing but GitHub's own tools.)
    permissions:
      contents: read
    container:
      # Has flatpak-builder and the KDE runtime of this version; keep in step
      # with runtime-version in the manifest. (The image as it was on
      # 2026-11-22; the runtime in it is brought up to date by the build.)
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The image has the SDK installed in a layer below the one a container
      # writes to. Updating a runtime moves its folder aside, which Docker's
      # file system refuses for a folder from below ("Invalid cross-device
      # link"), so the build ended there whenever Flathub had a newer SDK than
      # the image (0.10.1's did). A copy made here is the container's own.
      - name: Make the installed runtimes updatable
        run: |
          if ! mountpoint -q /var/lib/flatpak; then
            cp -a /var/lib/flatpak /var/lib/flatpak.own
            rm -rf /var/lib/flatpak
            mv /var/lib/flatpak.own /var/lib/flatpak
          fi

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: kite.flatpak
          manifest-path: flatpak/io.github.n4n0gh.kite.yml
          branch: stable
          upload-artifact: false
          # Reused as long as the manifest and the crates it lists are unchanged.
          cache-key: flatpak-builder-${{ hashFiles('flatpak/*.yml', 'flatpak/*.json') }}

      # Replaces the bundle with one that updates from the repository, and
      # prepares the repository for publishing. Signed if the secret is set;
      # what is going to be published isn't made without it.
      - name: Prepare repository and bundle
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          REQUIRE_SIGNING: ${{ github.event_name == 'release' || inputs.publish }}
        run: |
          rm -f kite.flatpak
          flatpak/make-site.sh repo site "$SITE_URL" stable

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kite-flatpak
          path: kite.flatpak
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  # The one job that may write to the release. It takes the bundle the build
  # made and attaches it with GitHub's own command line tool, which runners
  # come with.
  attach:
    name: Attach the bundle to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kite-flatpak
      - name: Attach kite.flatpak
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" kite.flatpak --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish repository
    if: github.event_name == 'release' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
