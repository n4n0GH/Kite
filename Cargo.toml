[workspace]
resolver = "2"
members = ["crates/kite-core", "crates/kite"]

[workspace.package]
version = "0.5.8"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
url = "2"

# Optimise dependencies in dev builds: the network interceptor runs the
# adblock engine (regex-heavy) on the UI thread for every request, and
# unoptimised it takes >100 ms on long URLs like YouTube's video segments,
# which stutters video playback. Argon2 key derivation is deliberately
# expensive too. Kite's own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
